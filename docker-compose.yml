version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit_scoring_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://cs_user:cs_pass@db:5432/credit_scoring
      - MODEL_PATH=/app/models/xgboost_model.pkl
      - DEFAULT_THRESHOLD=0.15
      - LOW_RISK_THRESHOLD=0.10
      - MEDIUM_RISK_THRESHOLD=0.25
    volumes:
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: credit_scoring_frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: credit_scoring_db
    environment:
      POSTGRES_USER: cs_user
      POSTGRES_PASSWORD: cs_pass
      POSTGRES_DB: credit_scoring
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs_user -d credit_scoring"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
